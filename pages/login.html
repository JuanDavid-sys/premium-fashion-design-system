<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — ATELIER</title>
  <link rel="stylesheet" href="../assets/styles/tokens.css">
  <link rel="stylesheet" href="../assets/styles/base.css">
  <link rel="stylesheet" href="../assets/styles/components.css">
  <style>
    .auth-page { display: grid; grid-template-columns: 1fr 1fr; min-height: 100vh; }
    .auth-form-side { display: flex; flex-direction: column; justify-content: center; padding: var(--space-16) var(--space-12); }
    .auth-form-inner { max-width: 420px; margin: 0 auto; width: 100%; }
    .auth-image-side { position: relative; overflow: hidden; background: var(--color-bg-secondary); }
    .auth-image-side img { width: 100%; height: 100%; object-fit: cover; }
    .auth-image-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.4), transparent); display: flex; flex-direction: column; justify-content: flex-end; padding: var(--space-10); color: white; }
    .auth-tabs { display: flex; gap: 0; margin-bottom: var(--space-8); border-bottom: 1px solid var(--color-border); }
    .auth-tab { flex: 1; padding: var(--space-4) 0; text-align: center; font-size: var(--text-sm); font-weight: var(--weight-medium); color: var(--color-text-tertiary); border-bottom: 2px solid transparent; cursor: pointer; transition: all var(--duration-fast); }
    .auth-tab-active { color: var(--color-text); border-bottom-color: var(--color-text); }
    .auth-divider { display: flex; align-items: center; gap: var(--space-4); margin: var(--space-6) 0; }
    .auth-divider::before, .auth-divider::after { content: ''; flex: 1; height: 1px; background: var(--color-border); }
    .auth-divider span { font-size: var(--text-xs); color: var(--color-text-tertiary); text-transform: uppercase; letter-spacing: var(--tracking-wider); }
    .social-login { display: flex; gap: var(--space-3); }
    .social-login-btn { flex: 1; height: 48px; display: flex; align-items: center; justify-content: center; gap: var(--space-2); border: 1px solid var(--color-border); border-radius: var(--radius-sm); font-size: var(--text-sm); font-weight: var(--weight-medium); cursor: pointer; transition: border-color var(--duration-fast); }
    .social-login-btn:hover { border-color: var(--color-text); }
    @media (max-width: 1024px) { .auth-page { grid-template-columns: 1fr; } .auth-image-side { display: none; } }
  </style>
</head>
<body>
  <div class="auth-page">
    <!-- Form Side -->
    <div class="auth-form-side">
      <div class="auth-form-inner">
        <a href="home.html" class="navbar-logo" style="letter-spacing: 0.12em; font-size: var(--text-2xl); display: block; text-align: center; margin-bottom: var(--space-10);">ATELIER</a>
        <!-- Tabs -->
        <div class="auth-tabs">
          <button class="auth-tab auth-tab-active" onclick="showLogin()">Sign In</button>
          <button class="auth-tab" onclick="showRegister()">Create Account</button>
        </div>
        <!-- Login Form -->
        <div id="loginForm">
          <form onsubmit="return false;">
            <div class="form-group" style="margin-bottom: var(--space-4);">
              <label class="form-label">Email</label>
              <input type="email" class="form-input" placeholder="jane@example.com">
            </div>
            <div class="form-group" style="margin-bottom: var(--space-4);">
              <div class="flex justify-between items-center">
                <label class="form-label" style="margin-bottom: 0;">Password</label>
                <a href="#" class="btn-link" style="font-size: var(--text-xs);">Forgot password?</a>
              </div>
              <input type="password" class="form-input" placeholder="Enter your password">
            </div>
            <div style="margin-bottom: var(--space-6);">
              <label class="checkbox-wrapper">
                <input type="checkbox" class="checkbox-input">
                <span class="checkbox-custom"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg></span>
                <span class="checkbox-label">Remember me</span>
              </label>
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-full">Sign In</button>
          </form>
          <div class="auth-divider"><span>or</span></div>
          <div class="social-login">
            <button class="social-login-btn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 1 7.38 16.75"/><path d="M12 2a10 10 0 0 0-7.38 16.75"/><path d="M2 12h20"/></svg>
              Apple
            </button>
            <button class="social-login-btn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
              Google
            </button>
          </div>
        </div>
        <!-- Register Form -->
        <div id="registerForm" style="display: none;">
          <form onsubmit="return false;">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); margin-bottom: var(--space-4);">
              <div class="form-group">
                <label class="form-label">First Name</label>
                <input type="text" class="form-input" placeholder="Jane">
              </div>
              <div class="form-group">
                <label class="form-label">Last Name</label>
                <input type="text" class="form-input" placeholder="Doe">
              </div>
            </div>
            <div class="form-group" style="margin-bottom: var(--space-4);">
              <label class="form-label">Email</label>
              <input type="email" class="form-input" placeholder="jane@example.com">
            </div>
            <div class="form-group" style="margin-bottom: var(--space-4);">
              <label class="form-label">Password</label>
              <input type="password" class="form-input" placeholder="Create a password">
            </div>
            <div class="form-group" style="margin-bottom: var(--space-6);">
              <label class="form-label">Confirm Password</label>
              <input type="password" class="form-input" placeholder="Confirm your password">
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-full">Create Account</button>
          </form>
          <div class="auth-divider"><span>or</span></div>
          <div class="social-login">
            <button class="social-login-btn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 1 7.38 16.75"/><path d="M12 2a10 10 0 0 0-7.38 16.75"/><path d="M2 12h20"/></svg>
              Apple
            </button>
            <button class="social-login-btn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
              Google
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- Image Side -->
    <div class="auth-image-side">
      <img src="https://images.unsplash.com/photo-1441984904996-e0b6ba687e04?w=960&h=1280&fit=crop" alt="Atelier Store">
      <div class="auth-image-overlay">
        <p style="font-size: var(--text-xs); font-weight: var(--weight-medium); letter-spacing: var(--tracking-mega); text-transform: uppercase; color: var(--color-accent); margin-bottom: var(--space-2);">Autumn/Winter 2026</p>
        <h2 style="font-family: var(--font-display); font-size: var(--text-3xl); font-weight: var(--weight-light); margin-bottom: var(--space-3);">Welcome to Atelier</h2>
        <p style="font-size: var(--text-sm); color: rgba(255,255,255,0.8); max-width: 320px;">Join our world of timeless elegance. Manage orders, save favorites, and discover new collections.</p>
      </div>
    </div>
  </div>
  <script>
    function showLogin() {
      document.getElementById('loginForm').style.display = 'block';
      document.getElementById('registerForm').style.display = 'none';
      document.querySelectorAll('.auth-tab')[0].classList.add('auth-tab-active');
      document.querySelectorAll('.auth-tab')[1].classList.remove('auth-tab-active');
    }
    function showRegister() {
      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('registerForm').style.display = 'block';
      document.querySelectorAll('.auth-tab')[1].classList.add('auth-tab-active');
      document.querySelectorAll('.auth-tab')[0].classList.remove('auth-tab-active');
    }
  </script>
</body>
</html>
